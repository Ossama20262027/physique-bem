<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="orbitG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <radialGradient id="nucleusG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle glow backdrop -->
  <circle cx="256" cy="256" r="160" fill="#3b82f6" opacity="0.3" filter="url(#glow)"/>

  <!-- Orbit 1 -->
  <ellipse cx="256" cy="256" rx="170" ry="65" fill="none" stroke="url(#orbitG)" stroke-width="8" transform="rotate(30 256 256)"/>
  <!-- Orbit 2 -->
  <ellipse cx="256" cy="256" rx="170" ry="65" fill="none" stroke="url(#orbitG)" stroke-width="8" transform="rotate(-30 256 256)"/>
  <!-- Orbit 3 -->
  <ellipse cx="256" cy="256" rx="170" ry="65" fill="none" stroke="url(#orbitG)" stroke-width="8" transform="rotate(90 256 256)"/>

  <!-- Electrons -->
  <circle cx="390" cy="180" r="12" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="120" cy="330" r="12" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="256" cy="90" r="12" fill="#60a5fa" filter="url(#glow)"/>

  <!-- Nucleus -->
  <circle cx="256" cy="256" r="42" fill="url(#nucleusG)" filter="url(#glow)"/>

  <!-- Energy / Lightning Bolt -->
  <path d="M256 215 L240 250 H262 L248 290 L275 248 H254 Z" fill="#ffffff"/>

  <!-- 4AM badge text -->
  <text x="256" y="445" text-anchor="middle" fill="#ffffff" font-family="'Cairo', sans-serif" font-size="44" font-weight="800" letter-spacing="2">4AM</text>
</svg>
